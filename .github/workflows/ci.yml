name: CI

# Cost shape (GitHub Actions minutes; macOS bills 10x and Windows 2x on private
# repos, so the expensive runners are the last thing to start and the first
# thing to skip):
#
#   pull request   Version consistency (seconds) + ONE ubuntu job
#                  (fmt, clippy, test). Docs-only pull requests stop after the
#                  version/secret checks. The macOS, Windows and Linux sandbox
#                  jobs are SKIPPED (a skipped job reports success, so the
#                  required check names still resolve) unless the pull request
#                  carries the `full-ci` label when it is opened or pushed to,
#                  or touches the Linux sandbox code (Linux Sandbox Conformance
#                  runs, nothing else changes).
#   push to main   everything: the composite-PR merge is the one place the full
#                  macOS + Windows + Linux matrix runs. Docs-only pushes are
#                  ignored by the trigger.
#   workflow_dispatch  everything, on any branch:
#                  gh workflow run ci.yml --ref <branch>
#
# Work is validated locally first with scripts/ci-local.sh (see CLAUDE.md,
# "Verification Before Every Commit"); CI is the final cheap check, not the
# development loop.

on:
  push:
    branches: [main]
    # Same rule as the docs-only detection below: repo-root *.md and docs/**.
    # Markdown under crates/, apps/ or templates/ is code (include_str!).
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    # No paths filter here: a workflow skipped by a path filter never reports
    # the required check names and leaves the pull request pending forever.
    # Docs-only pull requests are detected by scripts/ci-changes.sh instead.
  workflow_dispatch: {}

# Supersede stale PR runs; never cancel runs on main (each push to main must
# finish so the post-merge result and the save-on-main cache are complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # CI never uses a debugger. Dropping debuginfo shrinks build time, target/
  # size, cache size and Windows teardown. Incremental artifacts are useless on
  # a fresh runner and bloat the cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  # Cheap, always runs, and decides what the expensive jobs below do. Name is
  # stable: "Version consistency" is part of the proposed required set.
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # code=false only when a pull request touches nothing but docs. The jobs
      # below key off these with job-level `if`: a skipped job with a literal
      # name reports success, so required checks never hang pending (a skipped
      # MATRIX job reports an unexpanded name; that is why there is no matrix).
      code: ${{ steps.changes.outputs.code }}
      sandbox: ${{ steps.changes.outputs.sandbox }}
      plugins: ${{ steps.changes.outputs.plugins }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Classify the change
        id: changes
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Anything uncertain (API failure, empty list, dispatch) runs the
          # full pipeline: scripts/ci-changes.sh answers true for an empty list.
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=""
          elif [ "$EVENT" = "push" ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
              files=$(git diff --name-only "$BEFORE" "$SHA") || files=""
            fi
          fi
          echo "Changed files:"; echo "$files"
          printf '%s\n' "$files" | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

          full=false
          case "$EVENT" in
            push|workflow_dispatch) full=true ;;
            pull_request) case ",$LABELS," in *,full-ci,*) full=true ;; esac ;;
          esac
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          if [ "$full" = "false" ] && printf '%s\n' "$files" | grep -qE '^(crates/ta-runtime/|crates/ta-sandbox/)'; then
            echo "::notice title=Platform sandbox code changed::macOS Seatbelt and Windows AppContainer conformance only run on push to main, workflow_dispatch, or a pull request labelled full-ci. Validate locally with scripts/ci-local.sh or add the full-ci label (before pushing) for a real run."
          fi

      - name: Verify Cargo.toml, CLAUDE.md and every crate manifest agree on the version
        timeout-minutes: 5
        run: ./scripts/check-version-consistency.sh

      - name: PLAN.md status markers stand on their own lines
        timeout-minutes: 2
        run: ./scripts/check-plan-markers.sh --self-test && ./scripts/check-plan-markers.sh

      - name: No IP-sensitive documents in this public repository
        timeout-minutes: 5
        run: ./scripts/check-no-ip-docs.sh --all

      - name: Secret scan (real-shaped secrets outside the allowlist)
        timeout-minutes: 5
        run: |
          # Pattern-based, no dependencies. The checkout above provides the git
          # work tree that `git ls-files` needs. Allowlist: scripts/secret-scan.allowlist.
          ./scripts/secret-scan.sh --self-test
          ./scripts/secret-scan.sh

      - name: Scripts self-tests (change classifier, leftover-process guard)
        timeout-minutes: 5
        run: |
          ./scripts/ci-changes.sh --self-test
          ./scripts/ci-leftover-processes.sh --self-test

  # The ONE job a normal pull request runs. Cheap-first: formatting needs no
  # compilation, clippy type-checks the whole workspace (including every
  # platform-independent test target) before the slower test build, so a red
  # change fails in the first minutes.
  lint-and-test-ubuntu:
    name: Lint and Test (ubuntu-latest)
    needs: version-check
    if: needs.version-check.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Ceiling for the whole job. Every step below also has its own
    # timeout-minutes, so a hung step ends at its own limit, not here.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        timeout-minutes: 10

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 5

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 20

      - name: Run tests
        run: cargo test --workspace -- --test-threads=4
        timeout-minutes: 20

      # The three channel plugins each have their own [workspace], so none of
      # the workspace steps above build them. A plugin manifest that cannot
      # parse once shipped because nothing compiled it. They depend on nothing
      # in this workspace, so they run only when a plugin (or the toolchain or
      # this workflow) changed, or on a full run. They have their own target
      # dirs and a separate cache key; this adds no required check name.
      - name: Cache standalone plugin builds
        if: needs.version-check.outputs.plugins == 'true' || needs.version-check.outputs.full == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: standalone-plugins
          workspaces: |
            plugins/ta-channel-discord
            plugins/ta-channel-slack
            plugins/ta-channel-email
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Test standalone plugins (discord, slack, email)
        if: needs.version-check.outputs.plugins == 'true' || needs.version-check.outputs.full == 'true'
        run: |
          for plugin in ta-channel-discord ta-channel-slack ta-channel-email; do
            echo "::group::cargo test --manifest-path plugins/$plugin/Cargo.toml"
            cargo test --manifest-path plugins/$plugin/Cargo.toml || { echo "::endgroup::"; echo "FAILED: plugins/$plugin. Re-run: cargo test --manifest-path plugins/$plugin/Cargo.toml"; exit 1; }
            echo "::endgroup::"
          done
        timeout-minutes: 20

      # Smoke-test the debug binary the test step already built. Optimized
      # release builds are exercised by the nightly and release workflows, not
      # here (a release build on every push cost ~6 minutes per platform).
      - name: Test ta-cli --version (debug)
        run: ./target/debug/ta --version
        timeout-minutes: 5

      # Regression guard: a test run must not leave gh, ta-daemon or ta
      # processes behind (a Windows run once left about 7,000 gh processes).
      # Runs even when an earlier step failed so the leftovers are listed
      # next to the original failure; it never masks that failure because it
      # only adds its own red step.
      - name: Check for leftover gh, ta-daemon and ta processes
        if: always()
        run: ./scripts/ci-leftover-processes.sh
        timeout-minutes: 5

  # macOS: full run only (push to main, workflow_dispatch, `full-ci` label).
  # Starts after the ubuntu job is green so an obviously red change never pays
  # for a 10x runner. Job id and cache key match the old matrix job so the
  # existing macOS cache keeps hitting.
  lint-and-test:
    name: Lint and Test (macos-latest)
    needs: [version-check, lint-and-test-ubuntu]
    if: needs.version-check.outputs.code == 'true' && needs.version-check.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        timeout-minutes: 10

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      # Formatting is platform independent and already checked on ubuntu;
      # clippy is not (cfg(target_os = "macos") code is linted only here).
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 20

      - name: Run tests
        run: cargo test --workspace -- --test-threads=4
        timeout-minutes: 20

      # macOS Seatbelt conformance (v0.17.12.7): runs `ta-sandbox-probe` inside the
      # generated profile. The workspace test step above skips this suite on a host
      # that cannot run sandbox-exec; here a skip is a failure, so a runner image
      # change cannot silently turn the isolation proof off.
      - name: Seatbelt conformance (ta-sandbox-probe)
        env:
          TA_REQUIRE_SANDBOX_CONFORMANCE: "1"
        run: cargo test -p ta-runtime --test seatbelt_conformance -- --test-threads=1
        timeout-minutes: 10

      - name: Test ta-cli --version (debug)
        run: ./target/debug/ta --version
        timeout-minutes: 5

      - name: Check for leftover gh, ta-daemon and ta processes
        if: always()
        run: ./scripts/ci-leftover-processes.sh
        timeout-minutes: 5

  # Linux sandbox conformance (v0.17.12.8). The full bubblewrap + Landlock +
  # seccomp suite runs on the runner itself; the container steps remove one
  # layer at a time (no user namespaces, no Landlock) and check TA reports it.
  # A skipped test is a failure here, so a runner image change cannot quietly
  # turn the isolation proof off. Runs on a full run, or when a change touches
  # the sandbox code (scripts/ci-changes.sh `sandbox`).
  linux-sandbox-conformance:
    name: Linux Sandbox Conformance
    needs: version-check
    if: needs.version-check.outputs.code == 'true' && (needs.version-check.outputs.full == 'true' || needs.version-check.outputs.sandbox == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        timeout-minutes: 10

      - name: Install bubblewrap and allow user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
          # TA's probe reports this exact case; the suite needs it off here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
        timeout-minutes: 5

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-sandbox
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Host conformance (bubblewrap, Landlock, seccomp, relay)
        env:
          TA_REQUIRE_SANDBOX_CONFORMANCE: "1"
        run: cargo test -p ta-runtime --test linux_conformance -- --test-threads=1
        timeout-minutes: 30

      - name: Probe and unit tests for the Linux layers
        run: cargo test -p ta-runtime linux_
        timeout-minutes: 15

      - name: Degraded containers (no user namespaces, no Landlock)
        run: scripts/ci-linux-sandbox-containers.sh all
        timeout-minutes: 30

  # Windows: full run only. One job: clippy with warnings denied is the compile
  # gate that the separate "Windows Check" job used to be (it catches
  # `dead_code` on cfg(unix)-only helpers and other Windows-only compile
  # failures), and it runs FIRST so a Windows-only compile failure ends the job
  # in minutes instead of after the build and test. Required check name stable.
  windows-build:
    name: Windows Build
    needs: [version-check, lint-and-test-ubuntu]
    if: needs.version-check.outputs.code == 'true' && needs.version-check.outputs.full == 'true'
    runs-on: windows-latest
    # A healthy run takes under 30 minutes; a run that reaches this ceiling is
    # hung (see the leftover-process check at the end of the job).
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        timeout-minutes: 10

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Run clippy (compile gate, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 25

      - name: Run tests
        run: cargo test --workspace -- --test-threads=4
        timeout-minutes: 25

      # AppContainer conformance and the Credential Manager / DPAPI probe
      # (v0.17.12.9). A runner that cannot create an AppContainer profile fails
      # the step instead of skipping. The FINDING lines record what an
      # AppContainer process can reach; they are uploaded with the job.
      - name: AppContainer conformance and Credential Manager probe
        env:
          TA_REQUIRE_SANDBOX_CONFORMANCE: "1"
          TA_WINDOWS_FINDINGS: ${{ runner.temp }}\windows-findings.txt
        run: cargo test -p ta-runtime --test windows_conformance -- --test-threads=1 --nocapture
        timeout-minutes: 20

      - name: Upload Windows sandbox findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-sandbox-findings
          path: ${{ runner.temp }}\windows-findings.txt
          if-no-files-found: ignore
        timeout-minutes: 5

      - name: Test ta-cli --version (debug)
        run: target\debug\ta.exe --version
        timeout-minutes: 5

      # Regression guard (see the same step in the ubuntu job). On Windows
      # `cargo test` puts target\debug on PATH, so a test that spawns `gh`,
      # `ta` or `ta-daemon` by name runs the freshly built binary and can
      # leave it behind.
      - name: Check for leftover gh, ta-daemon and ta processes
        if: always()
        shell: pwsh
        run: ./scripts/ci-leftover-processes.ps1
        timeout-minutes: 5
