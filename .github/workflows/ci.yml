name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede stale PR runs; never cancel runs on main (each push to main must
# finish so the post-merge result and the save-on-main cache are complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # CI never uses a debugger. Dropping debuginfo shrinks build time, target/
  # size, cache size and Windows teardown. Incremental artifacts are useless on
  # a fresh runner and bloat the cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # 'false' only when a pull request touches nothing but docs. The heavy
      # steps in the jobs below key off this. The jobs themselves always run,
      # so the required check names always report (a job-level skip of a matrix
      # job reports an unexpanded name and leaves required checks pending).
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Detect docs-only pull request
        id: changes
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Docs-only means every changed file is a repo-root *.md or under
          # docs/. Markdown under crates/, apps/ or templates/ is NOT docs-only
          # because include_str! compiles it into binaries. Anything uncertain
          # (push events, API failure, empty list) runs the full pipeline.
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') && [ -n "$files" ]; then
              echo "Changed files:"; echo "$files"
              if ! echo "$files" | grep -qvE '^([^/]+\.md|docs/.*)$'; then
                code=false
              fi
            else
              echo "Could not list PR files; running full pipeline."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changes present: $code"
      - name: Verify Cargo.toml, CLAUDE.md, and .release.toml agree on version
        timeout-minutes: 5
        run: |
          # Cargo.toml is the single source of truth for semver.
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          # CLAUDE.md must echo it for agent context.
          CLAUDE_VER=$(grep 'Current version' CLAUDE.md | head -1 | sed "s/.*\`\(.*\)\`.*/\1/")

          # .release.toml must not be present with a stale version comment.
          # (It doesn't store version directly — Cargo.toml is authoritative — so we
          # just verify the two human-editable files agree with each other.)

          echo "Cargo.toml version : $CARGO_VER"
          echo "CLAUDE.md version  : $CLAUDE_VER"

          if [ "$CARGO_VER" != "$CLAUDE_VER" ]; then
            echo ""
            echo "ERROR: Version mismatch."
            echo "  Cargo.toml says: $CARGO_VER"
            echo "  CLAUDE.md says:  $CLAUDE_VER"
            echo ""
            echo "Fix: run ./scripts/bump-version.sh $CARGO_VER"
            echo "  or update CLAUDE.md manually to match Cargo.toml."
            exit 1
          fi
          echo "OK: versions consistent ($CARGO_VER)"

      - name: Secret scan (real-shaped secrets outside the allowlist)
        timeout-minutes: 5
        run: |
          # Pattern-based, no dependencies. The checkout above provides the git
          # work tree that `git ls-files` needs. Allowlist: scripts/secret-scan.allowlist.
          ./scripts/secret-scan.sh --self-test
          ./scripts/secret-scan.sh

  lint-and-test:
    name: Lint and Test
    needs: version-check
    runs-on: ${{ matrix.os }}
    # Ceiling for the whole job. Every step below also has its own
    # timeout-minutes, so a hung step ends at its own limit, not here.
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CODE: ${{ needs.version-check.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Docs-only change, skipping build and test
        if: env.CODE != 'true'
        run: echo "Only docs changed (see Version consistency job); code checks not required."
        timeout-minutes: 2

      - name: Install Nix
        if: env.CODE == 'true'
        uses: DeterminateSystems/nix-installer-action@main
        timeout-minutes: 15

      # Fast failure first: formatting needs no compilation.
      - name: Check formatting
        if: env.CODE == 'true'
        run: nix develop --command bash -c "cargo fmt --all -- --check"
        timeout-minutes: 5

      - name: Cache cargo registry and target
        if: env.CODE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Build all crates
        if: env.CODE == 'true'
        run: nix develop --command bash -c "cargo build --workspace --all-targets"
        timeout-minutes: 30

      - name: Run tests
        if: env.CODE == 'true'
        run: nix develop --command bash -c "cargo test --workspace -- --test-threads=4"
        timeout-minutes: 15

      - name: Run clippy
        if: env.CODE == 'true'
        run: nix develop --command bash -c "cargo clippy --workspace --all-targets -- -D warnings"
        timeout-minutes: 15

      # macOS Seatbelt conformance (v0.17.12.7): runs `ta-sandbox-probe` inside the
      # generated profile. The workspace test step above skips this suite on a host
      # that cannot run sandbox-exec; here a skip is a failure, so a runner image
      # change cannot silently turn the isolation proof off.
      - name: Seatbelt conformance (ta-sandbox-probe)
        if: env.CODE == 'true' && matrix.os == 'macos-latest'
        env:
          TA_REQUIRE_SANDBOX_CONFORMANCE: "1"
        run: nix develop --command bash -c "cargo test -p ta-runtime --test seatbelt_conformance -- --test-threads=1"
        timeout-minutes: 10

      # The three channel plugins each have their own [workspace], so none of
      # the workspace steps above build them. A plugin manifest that cannot
      # parse once shipped because nothing compiled it. Ubuntu is enough: the
      # plugins are platform independent. They have their own target dirs and
      # a separate cache key; this adds no required check name.
      - name: Cache standalone plugin builds
        if: env.CODE == 'true' && matrix.os == 'ubuntu-latest'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: standalone-plugins
          workspaces: |
            plugins/ta-channel-discord
            plugins/ta-channel-slack
            plugins/ta-channel-email
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Test standalone plugins (discord, slack, email)
        if: env.CODE == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          for plugin in ta-channel-discord ta-channel-slack ta-channel-email; do
            echo "::group::cargo test --manifest-path plugins/$plugin/Cargo.toml"
            nix develop --command bash -c "cargo test --manifest-path plugins/$plugin/Cargo.toml" || { echo "::endgroup::"; echo "FAILED: plugins/$plugin. Re-run: nix develop --command cargo test --manifest-path plugins/$plugin/Cargo.toml"; exit 1; }
            echo "::endgroup::"
          done
        timeout-minutes: 20

      # Pull requests smoke-test the debug binary already built above. The
      # optimized release build runs on pushes to main (and in the release and
      # nightly workflows).
      - name: Test ta-cli --version (debug)
        if: env.CODE == 'true'
        run: nix develop --command bash -c "./target/debug/ta --version"
        timeout-minutes: 5

      - name: Build ta-cli binary (release)
        if: env.CODE == 'true' && github.event_name == 'push'
        run: nix develop --command bash -c "cargo build --release -p ta-cli"
        timeout-minutes: 30

      - name: Test ta-cli --version (release)
        if: env.CODE == 'true' && github.event_name == 'push'
        run: nix develop --command bash -c "./target/release/ta --version"
        timeout-minutes: 5

      # Regression guard: a test run must not leave gh, ta-daemon or ta
      # processes behind (a Windows run once left about 7,000 gh processes).
      # Runs even when an earlier step failed so the leftovers are listed
      # next to the original failure; it never masks that failure because it
      # only adds its own red step. Skipped on docs-only changes.
      - name: Check for leftover gh, ta-daemon and ta processes
        if: always() && env.CODE == 'true'
        run: |
          ./scripts/ci-leftover-processes.sh --self-test
          ./scripts/ci-leftover-processes.sh
        timeout-minutes: 5

  # Linux sandbox conformance (v0.17.12.8). The full bubblewrap + Landlock +
  # seccomp suite runs on the runner itself; the container steps remove one
  # layer at a time (no user namespaces, no Landlock) and check TA reports it.
  # A skipped test is a failure here, so a runner image change cannot quietly
  # turn the isolation proof off.
  linux-sandbox-conformance:
    name: Linux Sandbox Conformance
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODE: ${{ needs.version-check.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Install Nix
        if: env.CODE == 'true'
        uses: cachix/install-nix-action@v31
        timeout-minutes: 10

      - name: Install bubblewrap and allow user namespaces
        if: env.CODE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
          # TA's probe reports this exact case; the suite needs it off here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
        timeout-minutes: 5

      - name: Cache cargo registry and target
        if: env.CODE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-sandbox
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Host conformance (bubblewrap, Landlock, seccomp, relay)
        if: env.CODE == 'true'
        env:
          TA_REQUIRE_SANDBOX_CONFORMANCE: "1"
        run: nix develop --command bash -c "cargo test -p ta-runtime --test linux_conformance -- --test-threads=1"
        timeout-minutes: 30

      - name: Probe and unit tests for the Linux layers
        if: env.CODE == 'true'
        run: nix develop --command bash -c "cargo test -p ta-runtime linux_"
        timeout-minutes: 15

      - name: Degraded containers (no user namespaces, no Landlock)
        if: env.CODE == 'true'
        run: scripts/ci-linux-sandbox-containers.sh all
        timeout-minutes: 30

  # Windows build verification (v0.9.1)
  windows-build:
    name: Windows Build
    needs: version-check
    runs-on: windows-latest
    # A healthy run takes under 20 minutes; a run that reaches this ceiling is
    # hung (see the leftover-process check at the end of the job).
    timeout-minutes: 60
    env:
      CODE: ${{ needs.version-check.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Docs-only change, skipping build and test
        if: env.CODE != 'true'
        run: echo "Only docs changed (see Version consistency job); code checks not required."
        timeout-minutes: 2

      - name: Show Rust toolchain
        if: env.CODE == 'true'
        # windows-latest ships rustup preinstalled; it auto-installs and selects
        # whatever `rust-toolchain.toml` pins on the first cargo/rustc invocation
        # below, the same file `flake.nix` reads for the ubuntu/macos Nix jobs.
        # No install step needed. This just makes the resolved version visible
        # in CI logs instead of relying on silent auto-resolution.
        run: rustc --version && cargo --version
        timeout-minutes: 10

      - name: Cache cargo registry and target
        if: env.CODE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 15

      - name: Build all crates
        if: env.CODE == 'true'
        run: cargo build --workspace --all-targets
        timeout-minutes: 30

      - name: Run tests
        if: env.CODE == 'true'
        run: cargo test --workspace -- --test-threads=4
        timeout-minutes: 15

      - name: Run clippy
        if: env.CODE == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 15

      - name: Test ta-cli --version (debug)
        if: env.CODE == 'true'
        run: target\debug\ta.exe --version
        timeout-minutes: 5

      - name: Build ta-cli binary (release)
        if: env.CODE == 'true' && github.event_name == 'push'
        run: cargo build --release -p ta-cli
        timeout-minutes: 30

      - name: Test ta-cli --version (release)
        if: env.CODE == 'true' && github.event_name == 'push'
        run: target\release\ta.exe --version
        timeout-minutes: 5

      # Regression guard (see the same step in the Lint and Test job). On
      # Windows `cargo test` puts target\debug on PATH, so a test that spawns
      # `gh`, `ta` or `ta-daemon` by name runs the freshly built binary and can
      # leave it behind.
      - name: Check for leftover gh, ta-daemon and ta processes
        if: always() && env.CODE == 'true'
        shell: pwsh
        run: ./scripts/ci-leftover-processes.ps1
        timeout-minutes: 5
