# .ta/pricing.toml: Claude API list prices, USD per million tokens.
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing (read 2026-10-14).
# Prices change; re-check that page before trusting a cost report, and update this file.
#
# Why this file exists: TA's built-in table prices claude-sonnet-5-5 and claude-opus-5-5 at the
# older family tier, and has no row for claude-sonnet-5, claude-opus-5 or claude-haiku-5-5, so
# those turns are reported as unpriced. Rows here win over the built-in table (first match wins),
# so the more specific model name MUST come before the shorter one.
#
# Cache rates are the published ones, not a multiple of input:
#   - cache_read is 0.1x input for most models, 0.05x for Sonnet 5.5 and Opus 5.5.
#   - cache_write is the 5 minute write (1.25x input); cache_write_1h is the 1 hour write (2x).
#
# These are API list prices. They are NOT what a Claude subscription plan costs you, and they
# exclude batch discounts (50%), US-only inference (1.1x) and fast mode.

# Claude Sonnet 5.5: $2 in, $10 out, cache read $0.10, write $2.50 (5m) / $4 (1h)
[[model]]
name = "claude-sonnet-5-5"
input = 2.0
output = 10.0
cache_read = 0.10
cache_write = 2.50
cache_write_1h = 4.0

# Claude Sonnet 5: $2 in, $10 out, cache read $0.20, write $2.50 (5m) / $4 (1h)
# The $2/$10 price was introductory and is now the standard price (the sheet says the
# planned increase to $3/$15 will not occur).
[[model]]
name = "claude-sonnet-5"
input = 2.0
output = 10.0
cache_read = 0.20
cache_write = 2.50
cache_write_1h = 4.0

# Claude Opus 5.5: $4 in, $20 out, cache read $0.20, write $5 (5m) / $8 (1h)
[[model]]
name = "claude-opus-5-5"
input = 4.0
output = 20.0
cache_read = 0.20
cache_write = 5.0
cache_write_1h = 8.0

# Claude Opus 5: $5 in, $25 out, cache read $0.50, write $6.25 (5m) / $10 (1h)
[[model]]
name = "claude-opus-5"
input = 5.0
output = 25.0
cache_read = 0.50
cache_write = 6.25
cache_write_1h = 10.0

# Claude Fable 5.1: $10 in, $50 out, cache read $0.25, write $12.50 (5m) / $20 (1h)
[[model]]
name = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_read = 0.25
cache_write = 12.50
cache_write_1h = 20.0

# Claude Haiku 5.5, prompts up to 100,000 tokens: $0.10 in, $0.50 out, read $0.01, write $0.125 / $0.20.
# Prompts over 100,000 tokens cost more ($0.50 in, $2.50 out), and TA prices a turn from one row,
# so this row UNDERSTATES any Haiku 5.5 turn with a prompt over 100k tokens.
[[model]]
name = "claude-haiku-5-5"
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125
cache_write_1h = 0.20
