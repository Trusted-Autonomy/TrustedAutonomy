[workflow]
context_budget_chars = 100000   # reviewer agent budget (default 40k is too small for this codebase)

[verify]
commands = [
    "./dev 'cargo fmt --all -- --check'",
    "./dev 'cargo clippy --workspace --all-targets -- -D warnings'",
    # Compile-only check for the Windows target (dead_code on cfg(unix) helpers etc.), so such
    # failures are found here and not 20 minutes into CI. Skips loudly when rustup or the
    # target is missing; `ta doctor` says how to install it.
    "scripts/check-windows.sh --skip-if-unavailable",
    "./dev 'cargo test --workspace -- --test-threads=4'",
]
on_failure = "block"     # "block" (fail draft), "warn", or "agent" (let agent fix)
timeout = 2400           # seconds per command (workspace full test+compile ~20min)

# End-to-end smoke stage: runs before every draft is built (ta run, ta draft build), no human
# needed. Each case runs the real command in a scratch git repo. `ta smoke` runs them by hand.
[smoke]
on_failure = "block"     # "block" (no draft is created) or "warn" (failures ride along as draft warnings)
default_timeout_secs = 1800   # a case that runs `cargo run` may build ta first
# A draft that ADDS one of these files adds a command: it must carry a [[smoke.cases]] entry
# covering it, including one bad-input case (expect = "failure"). Helper modules that are
# not commands can opt out by living outside this directory or by adding a trivial case.
new_command_paths = ["apps/ta-cli/src/commands/*.rs"]

# v0.17.12.20: `ta golden replay` launched a real agent from a prompt that no longer matched
# the hash recorded at capture. Unit tests passed; only a hand run found it.
[[smoke.cases]]
name = "golden-replay-swapped-prompt"
covers = "apps/ta-cli/src/commands/golden.rs"
setup = ['''
set -e
mkdir -p .ta/golden/swapped
cd .ta/golden/swapped
printf 'the captured task\n' > prompt.md
sha=$( (shasum -a 256 prompt.md 2>/dev/null || sha256sum prompt.md) | cut -d' ' -f1)
printf '{"id":"swapped","title":"swapped prompt","source_goal_id":"00000000-0000-0000-0000-000000000000","start_commit":"%s","prompt_sha256":"%s","baseline":{"cost_usd":0,"input_tokens":0,"output_tokens":0,"outcome":"applied","files_changed":0,"lines_added":0,"lines_removed":0,"diff_sha256":"x","captured_at":"2026-01-01T00:00:00Z"}}' "$(git rev-parse HEAD)" "$sha" > entry.json
printf 'a DIFFERENT task, swapped in after capture\n' > prompt.md
''']
run = "$TA_SMOKE_TA golden replay swapped"
expect = "failure"
expect_output = "no longer matches the hash"

[commit]
# Files auto-staged alongside every `ta draft apply --git-commit`.
# Add any file that TA writes outside the draft artifact list.
# Merged with built-in lock files (Cargo.lock, package-lock.json, etc.).
auto_stage = [
    ".ta/goal-audit.jsonl",        # TA appends on every goal state change; shared audit trail
    ".ta/velocity-history.jsonl",  # TA appends velocity entries on draft apply; team-shared
    # Do NOT add .ta/workflow-runs/*.json — those are transient per-machine execution state
    "flake.lock",
]

[submit]
adapter = "git"          # "git" or "none" (default: "none")
auto_commit = true       # Commit on every ta pr apply
auto_push = true         # Push after commit
auto_review = true       # Open a PR after push

[submit.git]
branch_prefix = "feature/"  # Branch naming: feature/<goal-slug>
target_branch = "main"
merge_strategy = "squash" # squash, merge, or rebase
remote = "origin"        # Git remote name
pr_template = ".ta/pr-template.md"  # PR body template with {summary}, {why}, etc.
auto_merge = true        # Enable GitHub auto-merge (merges when CI passes) -- merges phase PRs into the integration branch above, NOT into main