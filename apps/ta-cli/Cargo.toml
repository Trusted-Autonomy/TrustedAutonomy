ta-workspace = { path = "../../crates/ta-workspace", version = "0.17.11-alpha.4" }
ta-workflow = { path = "../../crates/ta-workflow", version = "0.17.11-alpha.4" }
ta-plan = { path = "../../crates/ta-plan", version = "0.17.11-alpha.4" }
ta-build = { path = "../../crates/ta-build", version = "0.17.11-alpha.4" }
ta-output-schema = { path = "../../crates/ta-output-schema", version = "0.17.11-alpha.4" }
