[package]
name = "ta-cli"
version.workspace = true
edition = "2021"
description = "CLI for goals, PR review, and approvals in Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "review", "staging"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ta"
path = "src/main.rs"

# `gh` PATH-shadow wrapper for broker-mediated GitHub credentials
# (v0.17.6.7) — see src/bin/gh_shim.rs for the full design. Built as a
# sibling binary of `ta` so `ta run` can stage a copy at
# `<project_root>/.ta/bin/gh` from right next to the running `ta` binary.
[[bin]]
name = "gh"
path = "src/bin/gh_shim.rs"

[features]
default = ["ruvector"]
ruvector = ["ta-memory/ruvector"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
rustyline = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
glob = { workspace = true }
which = { workspace = true }
arboard = { workspace = true }

# Internal crates — version kept in sync with workspace by bump-version.sh
ta-audit = { path = "../../crates/ta-audit", version = "0.17.11-alpha.4" }
ta-credentials = { path = "../../crates/ta-credentials", version = "0.17.11-alpha.4" }
ta-memory = { path = "../../crates/ta-memory", version = "0.17.11-alpha.4" }
ta-changeset = { path = "../../crates/ta-changeset", version = "0.17.11-alpha.4" }
ta-connector-fs = { path = "../../crates/ta-connectors/fs", version = "0.17.11-alpha.4" }
ta-connector-unreal = { path = "../../crates/ta-connectors/unreal", version = "0.17.11-alpha.4" }
ta-connector-comfyui = { path = "../../crates/ta-connectors/comfyui", version = "0.17.11-alpha.4" }
ta-connector-unity = { path = "../../crates/ta-connectors/unity", version = "0.17.11-alpha.4" }
ta-goal = { path = "../../crates/ta-goal", version = "0.17.11-alpha.4" }
ta-mcp-gateway = { path = "../../crates/ta-mcp-gateway", version = "0.17.11-alpha.4" }
ta-policy = { path = "../../crates/ta-policy", version = "0.17.11-alpha.4" }
ta-mediation = { path = "../../crates/ta-mediation", version = "0.17.11-alpha.4" }
ta-session = { path = "../../crates/ta-session", version = "0.17.11-alpha.4" }
ta-events = { path = "../../crates/ta-events", version = "0.17.11-alpha.4" }
