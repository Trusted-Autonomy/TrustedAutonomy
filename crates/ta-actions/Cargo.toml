[package]
name = "ta-actions"
version.workspace = true
edition = "2021"
description = "External Action Governance Framework for Trusted Autonomy (v0.13.4)"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "actions", "governance"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
ta-plugin = { path = "../ta-plugin", version = "0.17.12-alpha.4" }
ta-credentials = { path = "../ta-credentials", version = "0.17.12-alpha.4" }
ta-workspace = { path = "../ta-workspace", version = "0.17.12-alpha.4" }
ta-audit = { path = "../ta-audit", version = "0.17.12-alpha.4" }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
