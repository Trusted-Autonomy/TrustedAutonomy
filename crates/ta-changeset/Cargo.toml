[package]
name = "ta-changeset"
version.workspace = true
edition = "2021"
description = "ChangeSet and PR Package data model for Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "review", "diff"]
categories = ["development-tools"]

[features]
# Exposes `draft_package::make_test_pkg` to other crates' tests.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
schemars = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
toml = "0.8"
reqwest = { workspace = true }
anyhow = { workspace = true }
ta-goal = { path = "../ta-goal", version = "0.17.12-alpha.5" }

[dev-dependencies]
tempfile = { workspace = true }
