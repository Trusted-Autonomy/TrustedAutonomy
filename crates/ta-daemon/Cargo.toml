[package]
name = "ta-daemon"
version.workspace = true
edition = "2021"
description = "MCP server daemon and HTTP API for Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "daemon", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { version = "0.5", features = ["util"] }
toml = { workspace = true }
serde_yaml = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
async-stream = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ta-credentials = { path = "../ta-credentials", version = "0.17.12-alpha.2" }

# Internal crates
ta-mcp-gateway = { path = "../ta-mcp-gateway", version = "0.17.12-alpha.2" }
ta-workspace = { path = "../ta-workspace", version = "0.17.12-alpha.2" }
ta-changeset = { path = "../ta-changeset", version = "0.17.12-alpha.2" }
ta-memory = { path = "../ta-memory", version = "0.17.12-alpha.2" }
ta-events = { path = "../ta-events", version = "0.17.12-alpha.2" }
ta-goal = { path = "../ta-goal", version = "0.17.12-alpha.2" }
ta-plan = { path = "../ta-plan", version = "0.17.12-alpha.2" }
ta-plan-wayfinder = { path = "../ta-plan-wayfinder", version = "0.17.12-alpha.2" }
ta-runtime = { path = "../ta-runtime", version = "0.17.12-alpha.2" }
ta-audit = { path = "../ta-audit", version = "0.17.12-alpha.2" }
ta-policy = { path = "../ta-policy", version = "0.17.12-alpha.2" }
ta-connector-slack = { path = "../ta-connectors/slack", version = "0.17.12-alpha.2" }
ta-connector-email = { path = "../ta-connectors/email", version = "0.17.12-alpha.2" }
reqwest = { workspace = true }
ta-output-schema = { path = "../ta-output-schema", version = "0.17.12-alpha.2" }
ta-extension = { path = "../ta-extension", version = "0.17.12-alpha.2" }
ta-session = { path = "../ta-session", version = "0.17.12-alpha.2" }
ta-advisor = { path = "../ta-advisor", version = "0.17.12-alpha.2" }
ta-data-spec = { path = "../ta-data-spec", version = "0.17.12-alpha.2" }
ta-init = { path = "../ta-init", version = "0.17.12-alpha.2" }
ta-lifecycle = { path = "../ta-lifecycle", version = "0.17.12-alpha.2" }
ta-agent-whiteboard = { path = "../ta-agent-whiteboard", version = "0.17.12-alpha.2" }
ta-credential-broker = { path = "../ta-credential-broker", version = "0.17.12-alpha.2" }
which = "7"
libc = { workspace = true }
async-trait = "0.1"
notify = { workspace = true }
# TLS transport support (v0.13.2).
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
