[package]
name = "ta-audit"
version.workspace = true
edition = "2021"
description = "Append-only event log and artifact hashing for Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "audit", "review"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
ta-credentials = { path = "../ta-credentials", version = "0.17.12-alpha.11" }

[dev-dependencies]
tempfile = { workspace = true }
