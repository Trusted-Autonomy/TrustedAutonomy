[package]
name = "ta-policy"
version.workspace = true
edition = "2021"
description = "Capability manifests and policy evaluation for Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "policy", "security"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
glob = { workspace = true }
tracing = { workspace = true }
ta-goal = { path = "../ta-goal", version = "0.17.11-alpha.23" }

[dev-dependencies]
tempfile = { workspace = true }
typed-ask = { git = "https://github.com/Trusted-Autonomy/typed-ask", tag = "v0.1.0" }
