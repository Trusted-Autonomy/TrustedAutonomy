[package]
name = "ta-workflow"
version.workspace = true
edition = "2021"
description = "Pluggable workflow engine for multi-stage, multi-role orchestration in Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "workflow", "orchestration"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
ta-changeset = { path = "../ta-changeset", version = "0.17.10-alpha.2" }
task-graph = { git = "https://github.com/Trusted-Autonomy/task-graph", tag = "v0.1.0" }
# Reused by graph::nodes::PolicyReviewer (v0.17.7.1) — wraps the existing
# should_auto_approve_draft rule evaluation as one ReviewerNode, per
# constitution §1.7 (reuse before reinventing). Leaf crate, no cycle risk.
ta-policy = { path = "../ta-policy", version = "0.17.10-alpha.2" }
# Reused by graph::nodes::AdvisorConfidenceReviewer (v0.17.7.1) — wraps the
# existing gate::decide() confidence check as one ReviewerNode. Leaf crate,
# no cycle risk.
ta-decision = { git = "https://github.com/Trusted-Autonomy/decision-gate", tag = "v0.1.0", package = "decision-gate" }
# Multi-agent consensus (Raft/Paxos/weighted), extracted v0.17.10 Part 4.
# `decision-gate` feature enables the consensus -> decision-gate adapter
# (decision_bridge), reused by graph::nodes::WeightedDecisionNode.
consensus-panel = { git = "https://github.com/Trusted-Autonomy/consensus-panel", tag = "v0.1.0", features = ["decision-gate"] }

[dev-dependencies]
tempfile = { workspace = true }
