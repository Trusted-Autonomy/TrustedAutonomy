[package]
name = "ta-cleanup"
version.workspace = true
edition = "2021"
description = "One cleanup engine for Trusted Autonomy: scans, classifies each finding from ground truth, acts on the safe ones and asks a human about the rest"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "cleanup"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
flate2 = "1"
ta-changeset = { path = "../ta-changeset", version = "0.17.12-alpha.5" }
ta-goal = { path = "../ta-goal", version = "0.17.12-alpha.5" }
ta-audit = { path = "../ta-audit", version = "0.17.12-alpha.5" }
ta-lifecycle = { path = "../ta-lifecycle", version = "0.17.12-alpha.5" }
ta-workspace = { path = "../ta-workspace", version = "0.17.12-alpha.5" }

[dev-dependencies]
tempfile = { workspace = true }
ta-changeset = { path = "../ta-changeset", version = "0.17.12-alpha.5", features = ["test-support"] }
