[package]
name = "ta-db-proxy"
version.workspace = true
edition = "2021"
description = "DbProxyPlugin trait for database proxy governance in Trusted Autonomy"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "database", "proxy"]
categories = ["development-tools", "database"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

ta-db-overlay = { path = "../ta-db-overlay", version = "0.17.11-alpha.5" }
ta-plugin = { path = "../ta-plugin", version = "0.17.11-alpha.5" }
ta-decision = { git = "https://github.com/Trusted-Autonomy/decision-gate", tag = "v0.1.0", package = "decision-gate" }
ta-actions = { path = "../ta-actions", version = "0.17.11-alpha.5" }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
