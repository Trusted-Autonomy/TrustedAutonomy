[package]
name = "ta-release"
version.workspace = true
edition = "2021"
description = "ReleaseAdapter trait and built-in adapters (GitHub, RemoteFile) for `ta release`"
license = "Apache-2.0"
repository = "https://github.com/trustedautonomy/ta"
homepage = "https://github.com/trustedautonomy/ta"
keywords = ["ai", "agent", "autonomy", "release", "publish"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
ta-plugin = { path = "../ta-plugin", version = "0.17.5-alpha.3" }

[dev-dependencies]
tempfile = { workspace = true }
